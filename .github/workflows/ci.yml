name: CI

on:
  pull_request:
  push:
    branches: [develop, staging, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: tests (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # La misma imagen que el desarrollo local (dockerfile.dev: Ubuntu 24.04, Node 22, Mesa y Xvfb): el check corre adentro.
      - name: Construir imagen de desarrollo
        run: docker build -f dockerfile.dev -t lib-mapa-dev .

      # Incluye la paridad TS == JSON de los tokens (pruebas/tokens.test.mjs) y los casos del catálogo.
      - name: Tests
        run: docker run --rm lib-mapa-dev npm test

      # Los .g. (Dart y TS) están al día con tokens/tokens.json, la copia de dart/assets/mapa/ con estilo/ y assets/,
      # y el paquete TS compila.
      - name: Tokens, assets del paquete Dart y TypeScript
        run: docker run --rm lib-mapa-dev sh -c "npm run comprobar-tokens && npm run comprobar-assets-dart && npm run typecheck"

      # Genera el estilo en dist/estilo/ y los fragmentos de capa en dist/capas/, y les corre gl-style-validate.
      - name: Validar estilo y fragmentos de capa
        run: docker run --rm lib-mapa-dev sh -c "npm run generar-estilo && npm run generar-capas && npm run validar-estilo"

      # Dibuja el estilo con MapLibre Native (Xvfb + Mesa) a z16, z17 y z18 sobre la muestra de Montevideo y lo
      # compara con pruebas/visual/referencia/ (con tolerancia). Si no coincide, las capturas nuevas y las
      # diferencias quedan como artefacto «capturas».
      - name: Capturas z16, z17 y z18
        run: docker run --rm -v "$PWD/dist:/app/dist" lib-mapa-dev npm run capturas

      - name: Subir las capturas que no coinciden
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: dist/capturas/
          if-no-files-found: ignore

      # Los archivos de la release (estilo, glyphs y sprites, notas del CHANGELOG) se arman sin publicar nada:
      # comprueba que las versiones del package.json y de dart/pubspec.yaml coinciden y que el CHANGELOG tiene la sección.
      - name: Armar la release (sin publicar)
        run: docker run --rm lib-mapa-dev node generadores/release.mjs

  dart:
    name: paridad Dart (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # El paquete colportores_mapa (dart/) compila, sus constantes son las de tokens/tokens.json (Dart == JSON) y
      # ContrasteMapa.bordeDeZona da lo mismo que el lado TS en pruebas/contraste/casos.json.
      # Misma versión de Dart que la app móvil (Flutter 3.44).
      - name: Analizar, comprobar la paridad y el contraste
        run: >-
          docker run --rm -v "$PWD/tokens:/w/tokens:ro" -v "$PWD/pruebas:/w/pruebas:ro" -v "$PWD/dart:/w/dart" -w /w/dart dart:3.12
          sh -c "dart pub get && dart analyze --fatal-infos && dart run tool/paridad.dart && dart run tool/contraste.dart"
