name: CI

on:
  pull_request:
  push:
    branches: [develop, staging, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: tests (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # La misma imagen que el desarrollo local (dockerfile.dev, Node 22): el check corre adentro.
      - name: Construir imagen de desarrollo
        run: docker build -f dockerfile.dev -t lib-mapa-dev .

      - name: Tests
        run: docker run --rm lib-mapa-dev npm test

      # gl-style-validate sobre el estilo generado (dist/estilo/). Hasta lib-mapa#2 no hay estilo y el paso solo avisa.
      - name: Validar estilo
        run: docker run --rm lib-mapa-dev npm run validar-estilo
